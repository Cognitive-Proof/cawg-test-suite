# CAWG Training and Data Mining Assertion 1.1.
# Each statement checks every cawg.training-mining* assertion in every manifest
# and reports offending assertions as "<manifest label>/<assertion label>".
include:
  - globals.yml

---

- id: training-mining:tdm_assertion_present
  description: The asset contains at least one CAWG training and data mining assertion. Every other statement is vacuously true without one.
  specSection: "CAWG Training and Data Mining 1.1 §Assertion definition"
  expression: |
    length(_tdm()) > `0`
  reportText:
    'true':
      en: "Found at least one cawg.training-mining assertion"
    'false':
      en: "No cawg.training-mining assertion found in any manifest"

- id: training-mining:assertion_label
  description: Training and data mining assertions are labeled cawg.training-mining, with a __N suffix for additional instances.
  specSection: "CAWG Training and Data Mining 1.1 §Overview"
  failIfMatched: true
  expression: |
    _tdm()[?_baseLabel(label) != "cawg.training-mining" ||
      (contains(label, "__") && !(toNumber(split(label, "__")[1]) >= `1`))].ref
  reportText:
    'true':
      en: "All training and data mining assertion labels are cawg.training-mining or cawg.training-mining__N"
    'false':
      en: "Training and data mining assertions with invalid labels: {{matches}}"

- id: training-mining:entries_present
  description: The assertion is a map with an `entries` map, as the 1.1 CDDL requires. (The 1.0 CDDL omitted `entries`; assertions in that layout put the entry keys at the top level.)
  specSection: "CAWG Training and Data Mining 1.1 §Schema and example"
  failIfMatched: true
  expression: |
    _tdm()[?type(value) != "object" || type(value.entries) != "object"].ref
  reportText:
    'true':
      en: "All training and data mining assertions contain an entries map"
    'false':
      en: "Training and data mining assertions without an entries map (possibly the 1.0 layout): {{matches}}"

- id: training-mining:entries_nonempty
  description: The entries map has one or more entries.
  specSection: "CAWG Training and Data Mining 1.1 §Overview"
  failIfMatched: true
  expression: |
    _tdm()[?type(value.entries) == "object" && length(_tdmKeys(@)) == `0`].ref
  reportText:
    'true':
      en: "All entries maps have at least one entry"
    'false':
      en: "Training and data mining assertions with an empty entries map: {{matches}}"

- id: training-mining:use_values_valid
  description: Every entry is a map whose `use` is allowed, notAllowed or constrained.
  specSection: "CAWG Training and Data Mining 1.1 §Overview, §Schema and example"
  failIfMatched: true
  expression: |
    _tdm()[?length(_tdmValues(@)[?type(@) != "object" || !contains($tdm_use_values, use || "")]) > `0`].ref
  reportText:
    'true':
      en: "Every entry has a use of allowed, notAllowed or constrained"
    'false':
      en: "Training and data mining assertions with a missing or invalid use value: {{matches}}"

- id: training-mining:constraint_info_wellformed
  description: If present, constraint_info is a non-empty text string.
  specSection: "CAWG Training and Data Mining 1.1 §Schema and example"
  failIfMatched: true
  expression: |
    _tdm()[?length(_tdmValues(@)[?type(@) == "object" && constraint_info != null &&
      (type(constraint_info) != "string" || constraint_info == "")]) > `0`].ref
  reportText:
    'true':
      en: "All constraint_info values are non-empty strings"
    'false':
      en: "Training and data mining assertions with an empty or non-text constraint_info: {{matches}}"

- id: training-mining:cawg_keys_defined
  description: Entry keys beginning with cawg. are one of the four defined by this specification. The prefix is reserved and MUST NOT be assigned by other claim generators.
  specSection: "CAWG Training and Data Mining 1.1 §Overview"
  failIfMatched: true
  expression: |
    _tdm()[?length(_tdmKeys(@)[?startsWith(@, "cawg.") && !contains($tdm_defined_keys, @)]) > `0`].ref
  reportText:
    'true':
      en: "All cawg.* entry keys are defined by CAWG Training and Data Mining 1.1"
    'false':
      en: "Training and data mining assertions using undefined cawg.* entry keys: {{matches}}"

- id: training-mining:custom_keys_label_syntax
  description: Custom entry keys follow the C2PA syntax for entity-specific labels (a domain-style namespace whose components match [a-zA-Z0-9][a-zA-Z0-9_-]*).
  specSection: "CAWG Training and Data Mining 1.1 §Overview; C2PA 2.4 §Namespacing"
  failIfMatched: true
  expression: |
    _tdm()[?length(_tdmKeys(@)[?!startsWith(@, "cawg.") && !startsWith(@, "c2pa.") && !_isEntityLabel(@)]) > `0`].ref
  reportText:
    'true':
      en: "All custom entry keys follow the C2PA entity-specific label syntax"
    'false':
      en: "Training and data mining assertions with custom entry keys that are not valid labels: {{matches}}"

- id: training-mining:constraints_info_spelling
  description: No entry uses `constraints_info`. The prose of the specification uses that spelling, but the CDDL and example define `constraint_info`.
  specSection: "CAWG Training and Data Mining 1.1 §Overview, §Schema and example"
  warnIfMatched: true
  expression: |
    _tdm()[?length(_tdmValues(@)[?type(@) == "object" && constraints_info != null]) > `0`].ref
  reportText:
    'true':
      en: "No entry uses constraints_info"
    'false':
      en: "Training and data mining assertions using constraints_info instead of constraint_info: {{matches}}"

- id: training-mining:legacy_c2pa_names
  description: No C2PA 1.x names are used, neither the c2pa.training-mining assertion label nor c2pa.* entry keys. This specification renamed them to cawg.*.
  specSection: "CAWG Training and Data Mining 1.1 §Overview (notice to implementers)"
  warnIfMatched: true
  expression: |
    [_legacyTdmLabels(), _tdm()[?length(_tdmKeys(@)[?startsWith(@, "c2pa.")]) > `0`].ref][]
  reportText:
    'true':
      en: "No C2PA 1.x training-mining names are used"
    'false':
      en: "C2PA 1.x training-mining names in use (rename to cawg.*): {{matches}}"

- id: training-mining:validation_no_failures
  description: The validator reported no failure codes for any training and data mining assertion.
  specSection: "CAWG Training and Data Mining 1.1 §Assertion definition"
  failIfMatched: true
  expression: |
    _tdm()[?length(_statusFor(@, results.failure || `[]`)) > `0`].ref
  reportText:
    'true':
      en: "No failure codes reported for training and data mining assertions"
    'false':
      en: "Training and data mining assertions with failure codes: {{matches}}"
