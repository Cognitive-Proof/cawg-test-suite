rubric_metadata:
  name: CAWG Metadata Assertion 1.1 Rubric (with 1.2-draft recommendations)
  issuer: CAWG Test Suite
  date: '2026-10-10T00:00:00Z'
  version: 0.1.0
  language: en
expressions:
  _baseLabel: 'split($args[0], "__")[0]

    '
  _labelFromUrl: 'split($args[0], "/")[-1]

    '
  _statusFor: |
    $args[1][?url == $args[0].label || (endsWith(url || "", "/" & $args[0].label) && contains(url || "", $args[0].manifest))]
  _contextKeys: |
    if(type($args[0]) == "object", keys($args[0]),
      if(type($args[0]) == "array" && length($args[0][?type(@) == "object"]) > `0`,
        map($args[0][?type(@) == "object"], &keys(@))[],
        null()))
  _contextIris: |
    if(type($args[0]) == "object",
      map(values($args[0]), &if(type(@) == "object", @.'@id', @))[?type(@) == "string"],
      if(type($args[0]) == "array",
        map($args[0][?type(@) == "object"], &_contextIris(@))[],
        `[]`))
  _identityReferencedLabels: |
    _refLabelsOf(map(entries($args[0].assertions)[?startsWith(@[0], "cawg.identity")], &@[1]))
  _refLabelsOf: |
    map($args[0][*].signer_payload.referenced_assertions[] || `[]`, &_labelFromUrl(url))
  _manifestMetadata: |
    entries($args[0].assertions)[?startsWith(@[0], "cawg.metadata")].{
      ref: $args[0].label & "/" & @[0],
      label: @[0],
      manifest: $args[0].label,
      value: @[1],
      gatheredLabels: map($args[0].'claim.v2'.gathered_assertions || `[]`, &_labelFromUrl(url)),
      identityRefLabels: _identityReferencedLabels($args[0]),
      results: $args[0].validationResults
    }
  _metadata: 'manifests[*]._manifestMetadata(@)[]

    '
  _undefinedTerms: |
    if(_contextKeys($args[1]) == null, `[]`,
      keys($args[0])[?!startsWith(@, "@") &&
        !startsWith(@, "http://") && !startsWith(@, "https://") &&
        !contains(_contextKeys($args[1]), @) &&
        !(contains(@, ":") && contains(_contextKeys($args[1]), split(@, ":")[0]))])
  _relativeContextIris: |
    _contextIris($args[0].value.'@context')[?!contains(@, "://") && !startsWith(@, "urn:")]
  _malformedUrns: '_malformedUrnsIn(values($args[0].value)[])

    '
  _malformedUrnsIn: |
    $args[0][?type(@) == "string" && startsWith(@, "urn:") &&
      (length(split(@, ":")) < `3` || split(@, ":")[1] == "" || split(@, ":")[2] == "")]

---

- id: metadata:metadata_assertion_present
  description: |-
    The asset contains at least one CAWG metadata assertion. Every other metadata statement is vacuously true without one.
  specSection: CAWG Metadata 1.1 §Assertion definition
  expression: 'length(_metadata()) > `0`

    '
  reportText:
    'true':
      en: Found at least one cawg.metadata assertion
    'false':
      en: No cawg.metadata assertion found in any manifest
- id: metadata:assertion_label
  description: |-
    Metadata assertions are labeled cawg.metadata, with a __N suffix for additional instances.
  specSection: CAWG Metadata 1.1 §Assertion definition
  failIfMatched: true
  expression: |
    _metadata()[?_baseLabel(label) != "cawg.metadata" ||
      (contains(label, "__") && !(toNumber(split(label, "__")[1]) >= `1`))].ref
  reportText:
    'true':
      en: All metadata assertion labels are cawg.metadata or cawg.metadata__N
    'false':
      en: 'Metadata assertions with invalid labels: {{matches}}'
- id: metadata:json_ld_object
  description: The assertion content is a single JSON-LD object.
  specSection: CAWG Metadata 1.1 §Assertion definition; C2PA 2.4 §Metadata common requirements
  failIfMatched: true
  expression: '_metadata()[?type(value) != "object"].ref

    '
  reportText:
    'true':
      en: All metadata assertions contain a JSON-LD object
    'false':
      en: 'Metadata assertions whose content is not a JSON object: {{matches}}'
- id: metadata:context_present
  description: |-
    The JSON-LD object includes an @context (an object, a URL string, or an array of those).
  specSection: CAWG Metadata 1.1 §Assertion definition; C2PA 2.4 §Metadata common requirements
  failIfMatched: true
  expression: |
    _metadata()[?type(value) == "object" && !contains(`["object", "string", "array"]`, type(value.'@context'))].ref
  reportText:
    'true':
      en: All metadata assertions include an @context
    'false':
      en: 'Metadata assertions without a usable @context: {{matches}}'
- id: metadata:terms_defined_in_context
  description: |-
    Every top-level field uses a prefix or term defined in @context (or is an absolute IRI). JSON-LD processors drop fields that cannot be expanded. Skipped when the context is remote-only.
  specSection: CAWG Metadata 1.1 §Assertion definition; C2PA 2.4 §Metadata common requirements
  warnIfMatched: true
  expression: |
    _metadata()[?type(value) == "object" && length(_undefinedTerms(value, value.'@context')) > `0`].ref
  reportText:
    'true':
      en: All metadata fields use a prefix or term defined in @context
    'false':
      en: |-
        Metadata assertions with fields whose prefix is not defined in @context: {{matches}}
- id: metadata:context_iris_absolute
  description: Namespace IRIs declared in @context are absolute.
  specSection: CAWG Metadata 1.1 §Assertion definition
  warnIfMatched: true
  expression: |
    _metadata()[?type(value) == "object" && length(_relativeContextIris(@)) > `0`].ref
  reportText:
    'true':
      en: All @context namespace IRIs are absolute
    'false':
      en: 'Metadata assertions declaring relative namespace IRIs in @context: {{matches}}'
- id: metadata:validation_no_failures
  description: |-
    The validator reported no failure codes for any metadata assertion. The c2pa.metadata field restrictions (C2PA Appendix B) do not apply to cawg.metadata.
  specSection: CAWG Metadata 1.1 §Assertion definition
  failIfMatched: true
  expression: '_metadata()[?length(_statusFor(@, results.failure || `[]`)) > `0`].ref

    '
  reportText:
    'true':
      en: No failure codes reported for metadata assertions
    'false':
      en: 'Metadata assertions with failure codes: {{matches}}'
- id: metadata:gathered_referenced_by_identity
  description: |-
    A metadata assertion in gathered_assertions (not attributed to the manifest signer) is referenced by a CAWG identity assertion in the same manifest.
  specSection: CAWG Metadata 1.2-draft §Use with identity assertion
  warnIfMatched: true
  expression: |
    _metadata()[?contains(gatheredLabels, label) && !contains(identityRefLabels, label)].ref
  reportText:
    'true':
      en: All gathered metadata assertions are referenced by an identity assertion
    'false':
      en: |-
        Gathered metadata assertions not referenced by any identity assertion: {{matches}}
- id: metadata:urn_values_wellformed
  description: |-
    Top-level values that begin with urn: are well-formed URNs (urn:<nid>:<nss>), since consumers treat them as URNs rather than human-readable text.
  specSection: CAWG Metadata 1.2-draft §Use with media industry identifiers
  warnIfMatched: true
  expression: '_metadata()[?type(value) == "object" && length(_malformedUrns(@)) > `0`].ref

    '
  reportText:
    'true':
      en: 'All urn: values are well-formed URNs'
    'false':
      en: 'Metadata assertions with malformed urn: values: {{matches}}'
