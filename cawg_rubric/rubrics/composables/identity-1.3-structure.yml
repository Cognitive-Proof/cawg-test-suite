# CAWG Identity Assertion 1.3: assertion structure (§5, §6).
# Each statement checks every cawg.identity* assertion in every manifest and
# reports offending assertions as "<manifest label>/<assertion label>".
include:
  - globals.yml

---

- id: identity:identity_assertion_present
  description: The asset contains at least one CAWG identity assertion. Every other identity statement is vacuously true without one.
  specSection: "CAWG Identity 1.3 §5.1"
  expression: |
    length(_identities()) > `0`
  reportText:
    'true':
      en: "Found at least one cawg.identity assertion"
    'false':
      en: "No cawg.identity assertion found in any manifest"

- id: identity:assertion_label
  description: Identity assertions are labeled cawg.identity, with a __N suffix for additional instances.
  specSection: "CAWG Identity 1.3 §5.1, §5.3"
  failIfMatched: true
  expression: |
    _identities()[?_baseLabel(label) != "cawg.identity" ||
      (contains(label, "__") && !(toNumber(split(label, "__")[1]) >= `1`))].ref
  reportText:
    'true':
      en: "All identity assertion labels are cawg.identity or cawg.identity__N"
    'false':
      en: "Identity assertions with invalid labels: {{matches}}"

- id: identity:required_fields
  description: Each identity assertion has signer_payload (with referenced_assertions and sig_type), signature and pad1.
  specSection: "CAWG Identity 1.3 §5.2"
  failIfMatched: true
  expression: |
    _identities()[?type(value.signer_payload) != "object" ||
      value.signer_payload.referenced_assertions == null ||
      type(value.signer_payload.sig_type) != "string" ||
      value.signature == null ||
      value.pad1 == null].ref
  reportText:
    'true':
      en: "All identity assertions contain signer_payload, signature and pad1"
    'false':
      en: "Identity assertions missing required fields (signer_payload.referenced_assertions, signer_payload.sig_type, signature or pad1): {{matches}}"

- id: identity:referenced_assertions_nonempty
  description: signer_payload.referenced_assertions is an array with at least one entry.
  specSection: "CAWG Identity 1.3 §5.1.1"
  failIfMatched: true
  expression: |
    _identities()[?type(value.signer_payload.referenced_assertions) != "array" ||
      length(value.signer_payload.referenced_assertions) == `0`].ref
  reportText:
    'true':
      en: "All identity assertions reference at least one assertion"
    'false':
      en: "Identity assertions with empty or missing referenced_assertions: {{matches}}"

- id: identity:referenced_assertions_resolve
  description: Every referenced assertion appears with the same label and hash in the claim, or in an ingredient claim in the manifest store.
  specSection: "CAWG Identity 1.3 §5.1.1, §7.1"
  failIfMatched: true
  expression: |
    _identities()[?length(_unresolvedRefs(@)) > `0`].ref
  reportText:
    'true':
      en: "All referenced assertions match an assertion listed in a claim"
    'false':
      en: "Identity assertions referencing assertions not found in any claim (cawg.identity.assertion.mismatch): {{matches}}"

- id: identity:referenced_assertions_in_own_claim
  description: Referenced assertions are normally in the same claim. References that resolve only through an ingredient claim are allowed but flagged for review.
  specSection: "CAWG Identity 1.3 §5.1.1"
  warnIfMatched: true
  expression: |
    _identities()[?length(_foreignRefs(@)) > `0`].ref
  reportText:
    'true':
      en: "All referenced assertions are in the identity assertion's own claim"
    'false':
      en: "Identity assertions referencing assertions outside their own claim: {{matches}}"

- id: identity:no_duplicate_references
  description: No assertion is referenced more than once.
  specSection: "CAWG Identity 1.3 §5.1.1, §7.1"
  failIfMatched: true
  expression: |
    _identities()[?length(unique(map(_refs(@), &_labelFromUrl(url)))) != length(_refs(@))].ref
  reportText:
    'true':
      en: "No identity assertion references the same assertion twice"
    'false':
      en: "Identity assertions with duplicate references (cawg.identity.assertion.duplicate): {{matches}}"

- id: identity:exactly_one_hard_binding
  description: referenced_assertions includes exactly one hard-binding assertion.
  specSection: "CAWG Identity 1.3 §5.1.1, §7.1"
  failIfMatched: true
  expression: |
    _identities()[?length(_hardBindingRefs(@)) != `1`].ref
  reportText:
    'true':
      en: "Every identity assertion references exactly one hard-binding assertion"
    'false':
      en: "Identity assertions without exactly one hard-binding reference (cawg.identity.hard_binding_missing): {{matches}}"

- id: identity:hard_binding_is_claims
  description: The referenced hard binding is the hard-binding assertion of the identity assertion's own claim.
  specSection: "CAWG Identity 1.3 §5.1.1, §7.1"
  failIfMatched: true
  expression: |
    _identities()[?length(_foreignHardBindingRefs(@)) > `0`].ref
  reportText:
    'true':
      en: "Every hard-binding reference matches the hard binding of its own claim"
    'false':
      en: "Identity assertions referencing a hard binding not in their own claim (cawg.identity.hard_binding_incorrect): {{matches}}"

- id: identity:no_self_reference
  description: An identity assertion does not reference itself.
  specSection: "CAWG Identity 1.3 §5.1.1"
  failIfMatched: true
  expression: |
    _identities()[?_isSelfReferencing(@)].ref
  reportText:
    'true':
      en: "No identity assertion references itself"
    'false':
      en: "Identity assertions that reference themselves: {{matches}}"

- id: identity:sig_type_known
  description: sig_type is one of the signature types defined in CAWG Identity 1.3 §8. Other types are allowed but most validators will report cawg.identity.sig_type.unknown.
  specSection: "CAWG Identity 1.3 §5.1, §8"
  warnIfMatched: true
  expression: |
    _identities()[?!contains($known_sig_types, value.signer_payload.sig_type)].ref
  reportText:
    'true':
      en: "All sig_type values are defined by CAWG Identity 1.3"
    'false':
      en: "Identity assertions with a sig_type not defined in CAWG Identity 1.3: {{matches}}"

- id: identity:role_wellformed
  description: If present, role is a non-empty array of non-empty strings.
  specSection: "CAWG Identity 1.3 §5.1.2"
  failIfMatched: true
  expression: |
    _identities()[?value.signer_payload.role != null && (
      type(value.signer_payload.role) != "array" ||
      length(value.signer_payload.role) == `0` ||
      length(value.signer_payload.role[?type(@) != "string" || @ == ""]) > `0`)].ref
  reportText:
    'true':
      en: "All role values are non-empty arrays of non-empty strings"
    'false':
      en: "Identity assertions with malformed role: {{matches}}"

- id: identity:role_cawg_namespace
  description: Role values in the reserved cawg. namespace are ones defined by CAWG Identity 1.3.
  specSection: "CAWG Identity 1.3 §5.1.2, §5.3"
  warnIfMatched: true
  expression: |
    _identities()[?length((value.signer_payload.role || `[]`)[?type(@) == "string" && startsWith(@, "cawg.") && !contains($recommended_roles, @)]) > `0`].ref
  reportText:
    'true':
      en: "All cawg.* role values are defined by CAWG Identity 1.3"
    'false':
      en: "Identity assertions using undefined cawg.* role values: {{matches}}"

- id: identity:pads_zero
  description: pad1 and pad2 contain only 0x00 bytes.
  specSection: "CAWG Identity 1.3 §6.2, §7.1"
  failIfMatched: true
  expression: |
    _identities()[?_padNonZero(value.pad1) || _padNonZero(value.pad2)].ref
  reportText:
    'true':
      en: "All pad1/pad2 values are zero-filled"
    'false':
      en: "Identity assertions with non-zero padding (cawg.identity.pad.invalid): {{matches}}"

- id: identity:no_removed_fields
  description: signer_payload does not use fields removed in 1.x (expected_partial_claim, expected_claim_generator, expected_countersigners). Validators ignore them.
  specSection: "CAWG Identity 1.3 §5.1"
  warnIfMatched: true
  expression: |
    _identities()[?length(keys(value.signer_payload || `{}`)[?contains($removed_signer_payload_fields, @)]) > `0`].ref
  reportText:
    'true':
      en: "No identity assertion uses removed signer_payload fields"
    'false':
      en: "Identity assertions using removed signer_payload fields: {{matches}}"
