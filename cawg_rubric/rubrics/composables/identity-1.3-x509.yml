# CAWG Identity Assertion 1.3: X.509 certificates and COSE signatures (§8.2).
# Applies to identity assertions with sig_type "cawg.x509.cose".
include:
  - globals.yml

---

- id: identity:x509_signature_decodable
  description: The signature of a cawg.x509.cose identity assertion is a COSE_Sign1 carrying an X.509 signing certificate.
  specSection: "CAWG Identity 1.3 §8.2.1"
  failIfMatched: true
  expression: |
    _identities()[?value.signer_payload.sig_type == "cawg.x509.cose" &&
      (type(value.signature) != "object" || value.signature.certificateInfo == null)].ref
  reportText:
    'true':
      en: "All cawg.x509.cose signatures decode to a COSE signature with a signing certificate"
    'false':
      en: "cawg.x509.cose identity assertions whose signature does not decode to a COSE signature with a certificate: {{matches}}"

- id: identity:x509_algorithm_allowed
  description: The X.509 identity signature uses an algorithm allowed by C2PA §13.2.
  specSection: "CAWG Identity 1.3 §8.2.1, §8.2.2"
  failIfMatched: true
  expression: |
    _identities()[?value.signer_payload.sig_type == "cawg.x509.cose" &&
      type(value.signature) == "object" &&
      !contains($allowed_algorithms, value.signature.algorithm || "")].ref
  reportText:
    'true':
      en: "All cawg.x509.cose signatures use an allowed algorithm"
    'false':
      en: "cawg.x509.cose identity assertions with a missing or disallowed algorithm (cawg.x509.algorithm.unsupported): {{matches}}"
