  - '7'
  - '8'
  - '9'
expressions:
  _baseLabel: 'split($args[0], "__")[0]

    '
  _labelFromUrl: 'split($args[0], "/")[-1]

    '
  _hashKey: 'substitute($args[0] || "", "''", "")

    '
  _refKey: '_labelFromUrl($args[0].url) & "|" & _hashKey($args[0].hash)

    '
  _claimRefs: |
    [$args[0].'claim.v2'.created_assertions || `[]`, $args[0].'claim.v2'.gathered_assertions || `[]`, $args[0].claim.assertions || `[]`][]
  _manifestIdentities: |
    entries($args[0].assertions)[?startsWith(@[0], "cawg.identity")].{
      ref: $args[0].label & "/" & @[0],
      label: @[0],
      manifest: $args[0].label,
      value: @[1],
      claimRefKeys: map(_claimRefs($args[0]), &_refKey(@)),
      results: $args[0].validationResults
    }
  _storeClaimRefKeys: 'map(manifests[*]._claimRefs(@)[], &_refKey(@))

    '
  _identities: '_withStoreRefKeys(manifests[*]._manifestIdentities(@)[], _storeClaimRefKeys())

    '
  _withStoreRefKeys: '$args[0][*].merge(@, {storeRefKeys: $args[1]})

    '
  _refs: '$args[0].value.signer_payload.referenced_assertions || `[]`

    '
  _hardBindingRefs: |
    _refs($args[0])[?contains($hard_binding_labels, _baseLabel(_labelFromUrl(url)))]
  _unresolvedRefs: '_refs($args[0])[?!contains($args[0].storeRefKeys, _refKey(@))]

    '
  _foreignRefs: '_refs($args[0])[?!contains($args[0].claimRefKeys, _refKey(@))]

    '
  _foreignHardBindingRefs: '_hardBindingRefs($args[0])[?!contains($args[0].claimRefKeys, _refKey(@))]

    '
  _isSelfReferencing: 'contains(map(_refs($args[0]), &_labelFromUrl(url)), $args[0].label)

    '
  _padNonZero: |
    if(type($args[0]) == "array",
      length($args[0][?@ != `0`]) > 0,
      if(type($args[0]) == "string",
        substitute(substitute(substitute(substitute($args[0], "b64", ""), "'", ""), "A", ""), "=", "") != "",
        false()))
  _statusFor: |
    $args[1][?url == $args[0].label || (endsWith(url || "", "/" & $args[0].label) && contains(url || "", $args[0].manifest))]
  _icaCredentials: '_identities()[?value.signature.credentialType == "IdentityClaimsAggregation"]

    '
  _contextKeys: |
    if(type($args[0]) == "object", keys($args[0]),
      if(type($args[0]) == "array" && length($args[0][?type(@) == "object"]) > `0`,
        map($args[0][?type(@) == "object"], &keys(@))[],
        null()))
  _contextIris: |
    if(type($args[0]) == "object",
      map(values($args[0]), &if(type(@) == "object", @.'@id', @))[?type(@) == "string"],
      if(type($args[0]) == "array",
        map($args[0][?type(@) == "object"], &_contextIris(@))[],
        `[]`))
  _identityReferencedLabels: |
    _refLabelsOf(map(entries($args[0].assertions)[?startsWith(@[0], "cawg.identity")], &@[1]))
  _refLabelsOf: |
    map($args[0][*].signer_payload.referenced_assertions[] || `[]`, &_labelFromUrl(url))
  _manifestMetadata: |
    entries($args[0].assertions)[?startsWith(@[0], "cawg.metadata")].{
      ref: $args[0].label & "/" & @[0],
      label: @[0],
      manifest: $args[0].label,
      value: @[1],
      gatheredLabels: map($args[0].'claim.v2'.gathered_assertions || `[]`, &_labelFromUrl(url)),
      identityRefLabels: _identityReferencedLabels($args[0]),
      results: $args[0].validationResults
    }
  _metadata: 'manifests[*]._manifestMetadata(@)[]

    '
  _undefinedTerms: |
    if(_contextKeys($args[1]) == null, `[]`,
      keys($args[0])[?!startsWith(@, "@") &&
        !startsWith(@, "http://") && !startsWith(@, "https://") &&
        !contains(_contextKeys($args[1]), @) &&
        !(contains(@, ":") && contains(_contextKeys($args[1]), split(@, ":")[0]))])
  _relativeContextIris: |
    _contextIris($args[0].value.'@context')[?!contains(@, "://") && !startsWith(@, "urn:")]
  _malformedUrns: '_malformedUrnsIn(values($args[0].value)[])

    '
  _malformedUrnsIn: |
    $args[0][?type(@) == "string" && startsWith(@, "urn:") &&
      (length(split(@, ":")) < `3` || split(@, ":")[1] == "" || split(@, ":")[2] == "")]
  _musicIsrcs: '_musicIsrcsIn([$args[0].value.''dc:identifier''][])

    '
  _musicIsrcsIn: '$args[0][?type(@) == "string" && startsWith(@, "urn:isrc:")]

    '
  _musicIsrcWellformed: '_musicIsrcCodeOk(substitute(substitute($args[0], "urn:isrc:", ""), "-", ""))

    '
  _musicIsrcCodeOk: |
    length($args[0]) == `12` &&
      length(split(left($args[0], 2), "")[?!contains($music_letters, @)]) == `0` &&
      length(split(mid($args[0], 2, 3), "")[?!contains($music_alnum, @)]) == `0` &&
      length(split(right($args[0], 7), "")[?!contains($music_digits, @)]) == `0`
  _musicBadIsrcs: '_musicIsrcs($args[0])[?!_musicIsrcWellformed(@)]

    '
  _musicPublisherRefs: |
    map(_identities()[?contains(value.signer_payload.role || `[]`, "cawg.publisher")], &_musicRefsOf(@))[]
  _musicRefsOf: 'map(_refLabelsOf([$args[0].value]), &($args[0].manifest & "/" & @))

    '
  _musicUnattested: '$args[0][?!contains($args[1], ref)].ref

    '

---

- id: identity:identity_assertion_present
  description: |-
    The asset contains at least one CAWG identity assertion. Every other identity statement is vacuously true without one.
  specSection: CAWG Identity 1.3 §5.1
  expression: 'length(_identities()) > `0`

    '
  reportText:
    'true':
      en: Found at least one cawg.identity assertion
    'false':
      en: No cawg.identity assertion found in any manifest
- id: identity:assertion_label
  description: |-
    Identity assertions are labeled cawg.identity, with a __N suffix for additional instances.
  specSection: CAWG Identity 1.3 §5.1, §5.3
  failIfMatched: true
  expression: |
    _identities()[?_baseLabel(label) != "cawg.identity" ||
      (contains(label, "__") && !(toNumber(split(label, "__")[1]) >= `1`))].ref
  reportText:
    'true':
      en: All identity assertion labels are cawg.identity or cawg.identity__N
    'false':
      en: 'Identity assertions with invalid labels: {{matches}}'
- id: identity:required_fields
  description: |-
    Each identity assertion has signer_payload (with referenced_assertions and sig_type), signature and pad1.
  specSection: CAWG Identity 1.3 §5.2
  failIfMatched: true
  expression: |
    _identities()[?type(value.signer_payload) != "object" ||
      value.signer_payload.referenced_assertions == null ||
      type(value.signer_payload.sig_type) != "string" ||
      value.signature == null ||
      value.pad1 == null].ref
  reportText:
    'true':
      en: All identity assertions contain signer_payload, signature and pad1
    'false':
      en: |-
        Identity assertions missing required fields (signer_payload.referenced_assertions, signer_payload.sig_type, signature or pad1): {{matches}}
- id: identity:referenced_assertions_nonempty
  description: signer_payload.referenced_assertions is an array with at least one entry.
  specSection: CAWG Identity 1.3 §5.1.1
  failIfMatched: true
  expression: |
    _identities()[?type(value.signer_payload.referenced_assertions) != "array" ||
      length(value.signer_payload.referenced_assertions) == `0`].ref
  reportText:
    'true':
      en: All identity assertions reference at least one assertion
    'false':
      en: 'Identity assertions with empty or missing referenced_assertions: {{matches}}'
- id: identity:referenced_assertions_resolve
  description: |-
    Every referenced assertion appears with the same label and hash in the claim, or in an ingredient claim in the manifest store.
  specSection: CAWG Identity 1.3 §5.1.1, §7.1
  failIfMatched: true
  expression: '_identities()[?length(_unresolvedRefs(@)) > `0`].ref

    '
  reportText:
    'true':
      en: All referenced assertions match an assertion listed in a claim
    'false':
      en: |-
        Identity assertions referencing assertions not found in any claim (cawg.identity.assertion.mismatch): {{matches}}
- id: identity:referenced_assertions_in_own_claim
  description: |-
    Referenced assertions are normally in the same claim. References that resolve only through an ingredient claim are allowed but flagged for review.
  specSection: CAWG Identity 1.3 §5.1.1
  warnIfMatched: true
  expression: '_identities()[?length(_foreignRefs(@)) > `0`].ref

    '
  reportText:
    'true':
      en: All referenced assertions are in the identity assertion's own claim
    'false':
      en: 'Identity assertions referencing assertions outside their own claim: {{matches}}'
- id: identity:no_duplicate_references
  description: No assertion is referenced more than once.
  specSection: CAWG Identity 1.3 §5.1.1, §7.1
  failIfMatched: true
  expression: |
    _identities()[?length(unique(map(_refs(@), &_labelFromUrl(url)))) != length(_refs(@))].ref
  reportText:
    'true':
      en: No identity assertion references the same assertion twice
    'false':
      en: |-
        Identity assertions with duplicate references (cawg.identity.assertion.duplicate): {{matches}}
- id: identity:exactly_one_hard_binding
  description: referenced_assertions includes exactly one hard-binding assertion.
  specSection: CAWG Identity 1.3 §5.1.1, §7.1
  failIfMatched: true
  expression: '_identities()[?length(_hardBindingRefs(@)) != `1`].ref

    '
  reportText:
    'true':
      en: Every identity assertion references exactly one hard-binding assertion
    'false':
      en: |-
        Identity assertions without exactly one hard-binding reference (cawg.identity.hard_binding_missing): {{matches}}
- id: identity:hard_binding_is_claims
  description: |-
    The referenced hard binding is the hard-binding assertion of the identity assertion's own claim.
  specSection: CAWG Identity 1.3 §5.1.1, §7.1
  failIfMatched: true
  expression: '_identities()[?length(_foreignHardBindingRefs(@)) > `0`].ref

    '
  reportText:
    'true':
      en: Every hard-binding reference matches the hard binding of its own claim
    'false':
      en: |-
        Identity assertions referencing a hard binding not in their own claim (cawg.identity.hard_binding_incorrect): {{matches}}
- id: identity:no_self_reference
  description: An identity assertion does not reference itself.
  specSection: CAWG Identity 1.3 §5.1.1
  failIfMatched: true
  expression: '_identities()[?_isSelfReferencing(@)].ref

    '
  reportText:
    'true':
      en: No identity assertion references itself
    'false':
      en: 'Identity assertions that reference themselves: {{matches}}'
- id: identity:sig_type_known
  description: |-
    sig_type is one of the signature types defined in CAWG Identity 1.3 §8. Other types are allowed but most validators will report cawg.identity.sig_type.unknown.
  specSection: CAWG Identity 1.3 §5.1, §8
  warnIfMatched: true
  expression: '_identities()[?!contains($known_sig_types, value.signer_payload.sig_type)].ref

    '
  reportText:
    'true':
      en: All sig_type values are defined by CAWG Identity 1.3
    'false':
      en: |-
        Identity assertions with a sig_type not defined in CAWG Identity 1.3: {{matches}}
- id: identity:role_wellformed
  description: If present, role is a non-empty array of non-empty strings.
  specSection: CAWG Identity 1.3 §5.1.2
  failIfMatched: true
  expression: |
    _identities()[?value.signer_payload.role != null && (
      type(value.signer_payload.role) != "array" ||
      length(value.signer_payload.role) == `0` ||
      length(value.signer_payload.role[?type(@) != "string" || @ == ""]) > `0`)].ref
  reportText:
    'true':
      en: All role values are non-empty arrays of non-empty strings
    'false':
      en: 'Identity assertions with malformed role: {{matches}}'
- id: identity:role_cawg_namespace
  description: |-
    Role values in the reserved cawg. namespace are ones defined by CAWG Identity 1.3.
  specSection: CAWG Identity 1.3 §5.1.2, §5.3
  warnIfMatched: true
  expression: |
    _identities()[?length((value.signer_payload.role || `[]`)[?type(@) == "string" && startsWith(@, "cawg.") && !contains($recommended_roles, @)]) > `0`].ref
  reportText:
    'true':
      en: All cawg.* role values are defined by CAWG Identity 1.3
    'false':
      en: 'Identity assertions using undefined cawg.* role values: {{matches}}'
- id: identity:pads_zero
  description: pad1 and pad2 contain only 0x00 bytes.
  specSection: CAWG Identity 1.3 §6.2, §7.1
  failIfMatched: true
  expression: '_identities()[?_padNonZero(value.pad1) || _padNonZero(value.pad2)].ref

    '
  reportText:
    'true':
      en: All pad1/pad2 values are zero-filled
    'false':
      en: |-
        Identity assertions with non-zero padding (cawg.identity.pad.invalid): {{matches}}
- id: identity:no_removed_fields
  description: |-
    signer_payload does not use fields removed in 1.x (expected_partial_claim, expected_claim_generator, expected_countersigners). Validators ignore them.
  specSection: CAWG Identity 1.3 §5.1
  warnIfMatched: true
  expression: |
    _identities()[?length(keys(value.signer_payload || `{}`)[?contains($removed_signer_payload_fields, @)]) > `0`].ref
  reportText:
    'true':
      en: No identity assertion uses removed signer_payload fields
    'false':
      en: 'Identity assertions using removed signer_payload fields: {{matches}}'
- id: identity:x509_signature_decodable
  description: |-
    The signature of a cawg.x509.cose identity assertion is a COSE_Sign1 carrying an X.509 signing certificate.
  specSection: CAWG Identity 1.3 §8.2.1
  failIfMatched: true
  expression: |
    _identities()[?value.signer_payload.sig_type == "cawg.x509.cose" &&
      (type(value.signature) != "object" || value.signature.certificateInfo == null)].ref
  reportText:
    'true':
      en: |-
        All cawg.x509.cose signatures decode to a COSE signature with a signing certificate
    'false':
      en: |-
        cawg.x509.cose identity assertions whose signature does not decode to a COSE signature with a certificate: {{matches}}
- id: identity:x509_algorithm_allowed
  description: The X.509 identity signature uses an algorithm allowed by C2PA §13.2.
  specSection: CAWG Identity 1.3 §8.2.1, §8.2.2
  failIfMatched: true
  expression: |
    _identities()[?value.signer_payload.sig_type == "cawg.x509.cose" &&
      type(value.signature) == "object" &&
      !contains($allowed_algorithms, value.signature.algorithm || "")].ref
  reportText:
    'true':
      en: All cawg.x509.cose signatures use an allowed algorithm
    'false':
      en: |-
        cawg.x509.cose identity assertions with a missing or disallowed algorithm (cawg.x509.algorithm.unsupported): {{matches}}
- id: identity:ica_credential_visible
  description: |-
    The ICA verifiable credential is exposed in crJSON. When it is not, the remaining ICA statements cannot check this assertion.
  specSection: CAWG Identity 1.3 §8.1.2
  warnIfMatched: true
  expression: |
    _identities()[?value.signer_payload.sig_type == "cawg.identity_claims_aggregation" &&
      value.signature.credentialType != "IdentityClaimsAggregation"].ref
  reportText:
    'true':
      en: All ICA identity assertions expose their verifiable credential in crJSON
    'false':
      en: |-
        ICA identity assertions whose verifiable credential is not visible in crJSON (ICA checks skipped): {{matches}}
- id: identity:ica_algorithm_allowed
  description: The ICA COSE signature uses an algorithm allowed by C2PA §13.2.
  specSection: CAWG Identity 1.3 §8.1.4, §8.1.5
  failIfMatched: true
  expression: |
    _icaCredentials()[?!contains($allowed_algorithms, value.signature.algorithm || "")].ref
  reportText:
    'true':
      en: All ICA signatures use an allowed algorithm
    'false':
      en: |-
        ICA identity assertions with a missing or disallowed algorithm (cawg.ica.invalid_alg): {{matches}}
- id: identity:ica_issuer_did
  description: The ICA credential issuer is a DID.
  specSection: CAWG Identity 1.3 §8.1.4, §8.1.5
  failIfMatched: true
  expression: |
    _icaCredentials()[?!startsWith(value.signature.issuer.id || value.signature.issuer || "", "did:")].ref
  reportText:
    'true':
      en: All ICA credential issuers are DIDs
    'false':
      en: |-
        ICA identity assertions whose issuer is not a DID (cawg.ica.invalid_issuer): {{matches}}
- id: identity:ica_valid_from_present
  description: |-
    The ICA credential has a validity start date (validFrom for VC 2.0, issuanceDate for VC 1.1).
  specSection: CAWG Identity 1.3 §8.1.2.4
  failIfMatched: true
  expression: |
    _icaCredentials()[?value.signature.validFrom == null && value.signature.issuanceDate == null].ref
  reportText:
    'true':
      en: All ICA credentials have a validity start date
    'false':
      en: |-
        ICA identity assertions missing validFrom/issuanceDate (cawg.ica.valid_from.missing): {{matches}}
- id: identity:ica_verified_identities_nonempty
  description: credentialSubject.verifiedIdentities is a non-empty array.
  specSection: CAWG Identity 1.3 §8.1.2.5
  failIfMatched: true
  expression: |
    _icaCredentials()[?type(value.signature.verifiedIdentities) != "array" ||
      length(value.signature.verifiedIdentities) == `0`].ref
  reportText:
    'true':
      en: All ICA credentials list at least one verified identity
    'false':
      en: |-
        ICA identity assertions with missing or empty verifiedIdentities (cawg.ica.verified_identities.missing): {{matches}}
- id: identity:ica_verified_identity_required_fields
  description: |-
    Each verifiedIdentities entry has a non-empty type, a provider with a name, and verifiedAt.
  specSection: CAWG Identity 1.3 §8.1.2.5
  failIfMatched: true
  expression: |
    _icaCredentials()[?length((value.signature.verifiedIdentities || `[]`)[?
      type(type) != "string" || type == "" ||
      type(provider) != "object" || type(provider.name) != "string" || provider.name == "" ||
      verifiedAt == null]) > `0`].ref
  reportText:
    'true':
      en: All verified identities have type, provider.name and verifiedAt
    'false':
      en: |-
        ICA identity assertions with verified identities missing type, provider.name or verifiedAt (cawg.ica.verified_identities.invalid): {{matches}}
- id: identity:ica_verified_identity_type_fields
  description: |-
    Verified identities carry the field their type requires (name for cawg.document_verification, username for cawg.social_media, address for cawg.crypto_wallet, uri for cawg.web_site).
  specSection: CAWG Identity 1.3 §8.1.2.5
  failIfMatched: true
  expression: |
    _icaCredentials()[?length((value.signature.verifiedIdentities || `[]`)[?
      (type == "cawg.document_verification" && (name == null || name == "")) ||
      (type == "cawg.social_media" && (username == null || username == "")) ||
      (type == "cawg.crypto_wallet" && (address == null || address == "")) ||
      (type == "cawg.web_site" && (uri == null || uri == ""))]) > `0`].ref
  reportText:
    'true':
      en: All verified identities include the field required by their type
    'false':
      en: |-
        ICA identity assertions with verified identities missing a type-specific field (cawg.ica.verified_identities.invalid): {{matches}}
- id: identity:validation_no_failures
  description: The validator reported no cawg.* failure codes for any identity assertion.
  specSection: CAWG Identity 1.3 §7.2, §8.1.5, §8.2.2
  failIfMatched: true
  expression: |
    _identities()[?length(_statusFor(@, results.failure || `[]`)[?startsWith(code, "cawg.")]) > `0`].ref
  reportText:
    'true':
      en: No cawg.* failure codes reported for identity assertions
    'false':
      en: 'Identity assertions with cawg.* failure codes: {{matches}}'
- id: identity:validation_status_reported
  description: |-
    The validator reported cawg.identity.well-formed or cawg.identity.trusted for each identity assertion.
  specSection: CAWG Identity 1.3 §7.2
  warnIfMatched: true
  expression: |
    _identities()[?length(_statusFor(@, results.success || `[]`)[?code == "cawg.identity.well-formed" || code == "cawg.identity.trusted"]) == `0`].ref
  reportText:
    'true':
      en: |-
        Every identity assertion has a cawg.identity.well-formed or cawg.identity.trusted status
    'false':
      en: |-
        Identity assertions without a cawg.identity.well-formed or cawg.identity.trusted status: {{matches}}
- id: metadata:metadata_assertion_present
  description: |-
    The asset contains at least one CAWG metadata assertion. Every other metadata statement is vacuously true without one.
  specSection: CAWG Metadata 1.1 §Assertion definition
  expression: 'length(_metadata()) > `0`

    '
  reportText:
    'true':
      en: Found at least one cawg.metadata assertion
    'false':
      en: No cawg.metadata assertion found in any manifest
- id: metadata:assertion_label
  description: |-
    Metadata assertions are labeled cawg.metadata, with a __N suffix for additional instances.
  specSection: CAWG Metadata 1.1 §Assertion definition
  failIfMatched: true
  expression: |
    _metadata()[?_baseLabel(label) != "cawg.metadata" ||
      (contains(label, "__") && !(toNumber(split(label, "__")[1]) >= `1`))].ref
  reportText:
    'true':
      en: All metadata assertion labels are cawg.metadata or cawg.metadata__N
    'false':
      en: 'Metadata assertions with invalid labels: {{matches}}'
- id: metadata:json_ld_object
  description: The assertion content is a single JSON-LD object.
  specSection: CAWG Metadata 1.1 §Assertion definition; C2PA 2.4 §Metadata common requirements
  failIfMatched: true
  expression: '_metadata()[?type(value) != "object"].ref

    '
  reportText:
    'true':
      en: All metadata assertions contain a JSON-LD object
    'false':
      en: 'Metadata assertions whose content is not a JSON object: {{matches}}'
- id: metadata:context_present
  description: |-
    The JSON-LD object includes an @context (an object, a URL string, or an array of those).
  specSection: CAWG Metadata 1.1 §Assertion definition; C2PA 2.4 §Metadata common requirements
  failIfMatched: true
  expression: |
    _metadata()[?type(value) == "object" && !contains(`["object", "string", "array"]`, type(value.'@context'))].ref
  reportText:
    'true':
      en: All metadata assertions include an @context
    'false':
      en: 'Metadata assertions without a usable @context: {{matches}}'
- id: metadata:terms_defined_in_context
  description: |-
    Every top-level field uses a prefix or term defined in @context (or is an absolute IRI). JSON-LD processors drop fields that cannot be expanded. Skipped when the context is remote-only.
  specSection: CAWG Metadata 1.1 §Assertion definition; C2PA 2.4 §Metadata common requirements
  warnIfMatched: true
  expression: |
    _metadata()[?type(value) == "object" && length(_undefinedTerms(value, value.'@context')) > `0`].ref
  reportText:
    'true':
      en: All metadata fields use a prefix or term defined in @context
    'false':
      en: |-
        Metadata assertions with fields whose prefix is not defined in @context: {{matches}}
- id: metadata:context_iris_absolute
  description: Namespace IRIs declared in @context are absolute.
  specSection: CAWG Metadata 1.1 §Assertion definition
  warnIfMatched: true
  expression: |
    _metadata()[?type(value) == "object" && length(_relativeContextIris(@)) > `0`].ref
  reportText:
    'true':
      en: All @context namespace IRIs are absolute
    'false':
      en: 'Metadata assertions declaring relative namespace IRIs in @context: {{matches}}'
- id: metadata:validation_no_failures
  description: |-
    The validator reported no failure codes for any metadata assertion. The c2pa.metadata field restrictions (C2PA Appendix B) do not apply to cawg.metadata.
  specSection: CAWG Metadata 1.1 §Assertion definition
  failIfMatched: true
  expression: '_metadata()[?length(_statusFor(@, results.failure || `[]`)) > `0`].ref

    '
  reportText:
    'true':
      en: No failure codes reported for metadata assertions
    'false':
      en: 'Metadata assertions with failure codes: {{matches}}'
- id: metadata:gathered_referenced_by_identity
  description: |-
    A metadata assertion in gathered_assertions (not attributed to the manifest signer) is referenced by a CAWG identity assertion in the same manifest. [Tightened from a warning to a failure by org.example.music.]
  specSection: CAWG Metadata 1.2-draft §Use with identity assertion
  failIfMatched: true
  expression: |
    _metadata()[?contains(gatheredLabels, label) && !contains(identityRefLabels, label)].ref
  reportText:
    'true':
      en: All gathered metadata assertions are referenced by an identity assertion
    'false':
      en: |-
        Gathered metadata assertions not referenced by any identity assertion: {{matches}}
- id: metadata:urn_values_wellformed
  description: |-
    Top-level values that begin with urn: are well-formed URNs (urn:<nid>:<nss>), since consumers treat them as URNs rather than human-readable text. [Tightened from a warning to a failure by org.example.music.]
  specSection: CAWG Metadata 1.2-draft §Use with media industry identifiers
  failIfMatched: true
  expression: '_metadata()[?type(value) == "object" && length(_malformedUrns(@)) > `0`].ref

    '
  reportText:
    'true':
      en: 'All urn: values are well-formed URNs'
    'false':
      en: 'Metadata assertions with malformed urn: values: {{matches}}'
- id: music:isrc_present
  description: |-
    At least one cawg.metadata assertion identifies the recording with an ISRC: a urn:isrc: value of dc:identifier.
  specSection: Example Music Profile 1.0 §2.1
  expression: |
    length(_metadata()[?type(value) == "object" && length(_musicIsrcs(@)) > `0`]) > `0`
  reportText:
    'true':
      en: Found an ISRC (urn:isrc:) in dc:identifier
    'false':
      en: 'No cawg.metadata assertion has a urn:isrc: value in dc:identifier'
- id: music:isrc_wellformed
  description: Every ISRC is 12 characters (CC-XXX-YY-NNNNN, hyphens optional) per ISO 3901.
  specSection: Example Music Profile 1.0 §2.1
  failIfMatched: true
  expression: '_metadata()[?type(value) == "object" && length(_musicBadIsrcs(@)) > `0`].ref

    '
  reportText:
    'true':
      en: All ISRCs are well formed
    'false':
      en: 'Metadata assertions with malformed ISRCs: {{matches}}'
- id: music:title_present
  description: Metadata that carries an ISRC also gives the recording's title (dc:title).
  specSection: Example Music Profile 1.0 §2.2
  warnIfMatched: true
  expression: |
    _metadata()[?type(value) == "object" && length(_musicIsrcs(@)) > `0` && type(value.'dc:title') != "string"].ref
  reportText:
    'true':
      en: Metadata with an ISRC also has a dc:title
    'false':
      en: 'Metadata assertions with an ISRC but no dc:title: {{matches}}'
- id: music:publisher_attests_metadata
  description: |-
    Every cawg.metadata assertion is referenced by an identity assertion whose signer has the cawg.publisher role, so the publisher vouches for the recording metadata.
  specSection: Example Music Profile 1.0 §3; CAWG Identity 1.3 §5.1.2
  failIfMatched: true
  expression: '_musicUnattested(_metadata(), _musicPublisherRefs())

    '
  reportText:
    'true':
      en: Every metadata assertion is attested by a cawg.publisher identity assertion
    'false':
      en: |-
        Metadata assertions not referenced by a cawg.publisher identity assertion: {{matches}}
