  - c2pa.hash.boxes
  - c2pa.hash.bmff
  - c2pa.hash.bmff.v2
  - c2pa.hash.bmff.v3
  - c2pa.hash.collection.data
  - c2pa.hash.multi-asset
  $allowed_algorithms:
  - es256
  - es384
  - es512
  - ps256
  - ps384
  - ps512
  - ed25519
  $music_letters:
