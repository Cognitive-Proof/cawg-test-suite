# Known failures of the reference validator used to generate fixtures/crjson/
# (c2pa-rs 0.91.2, Reader::to_crjson_value with tools/crjson-gen/cawg_test_settings.toml).
#
# CI runs check_validator.py with this baseline. A case not listed here that
# fails, or a listed case that passes, fails the build, so update this file
# when fixtures are regenerated with a newer c2pa-rs.

validator: c2pa-rs
version: 0.91.2

known_failures:
  - id: cbor_invalid
    reason: >-
      No cawg.identity.cbor.invalid in crJSON validationResults. The identity
      validator logs it through the direct IdentityAssertion API
      (sdk/src/identity/tests/validation_method/stop_on_error.rs), but Reader
      does not surface it.
  - id: assertion_mismatch
    reason: Reports cawg.identity.well-formed alongside cawg.identity.assertion.mismatch.
  - id: assertion_duplicate
    reason: Reports cawg.identity.well-formed alongside cawg.identity.assertion.duplicate.
  - id: hard_binding_missing
    reason: Reports cawg.identity.well-formed alongside cawg.identity.hard_binding_missing.
  - id: pad1_invalid
    reason: Reports cawg.identity.well-formed alongside cawg.identity.pad.invalid.
  - id: pad2_invalid
    reason: Reports cawg.identity.well-formed alongside cawg.identity.pad.invalid.
  - id: ica_did_unsupported_method
    reason: >-
      Reports cawg.ica.invalid_issuer instead of cawg.ica.did_unsupported_method
      (the c2pa-rs test for this fixture says the latter MUST be issued).

  # --- Cases from the c2pa-rs generator branch (cawg/conformance-fixtures) ---
  - id: identity_references_ingredient_assertion
    reason: >-
      A reference that exactly matches an assertion in the ingredient's claim is
      reported as cawg.identity.assertion.mismatch (§7.1 step 2 allows ingredient
      claims), and cawg.identity.well-formed is reported alongside it.
  - id: identity_hard_binding_incorrect
    reason: >-
      Never reaches the hard-binding check: the ingredient hard-binding reference is
      first reported as cawg.identity.assertion.mismatch (see above).
  - id: x509_algorithm_unsupported
    reason: >-
      cawg.x509.algorithm.unsupported is reported with url "Cose_Sign1" rather than
      the identity assertion's label (§7.2).
  - id: x509_outside_validity
    reason: Reports cawg.identity.well-formed alongside cawg.x509.signature.outside_validity.
  - id: x509_interim_mailbox_policy
    reason: >-
      Trusts a certificate with the mailbox-validated S/MIME policy, which the §8.2.4
      interim trust model excludes; certificate policy OIDs appear not to be checked.
  - id: ica_verified_identities_empty
    reason: Reports cawg.ica.invalid_verifiable_credential instead of cawg.ica.verified_identities.missing.
  - id: ica_verified_identity_missing_provider_name
    reason: Reports cawg.ica.invalid_verifiable_credential instead of cawg.ica.verified_identities.invalid.
  - id: ica_crypto_wallet_missing_address
    reason: Accepts a cawg.crypto_wallet verified identity without address.
  - id: ica_revocation_unsupported
    reason: Does not report cawg.ica.revocation.unsupported for an unknown credentialStatus method.
  - id: identity_multiple_assertions
    reason: >-
      Statuses for the second identity assertion are reported with url
      .../cawg.identity instead of .../cawg.identity__1, so cawg.identity__1 has
      no status of its own.

  # --- CAWG-Testfiles assets (fixtures/assets/testfiles/) ---
  # Every one of these passes on c2pa-rs main plus the fix branches merged into
  # cawg/testfiles on mrappard/c2pa-rs-text-support (see TODO.md).
  - id: tf_ica_trusted_issuer
    reason: >-
      Decodes the did:jwk identifier as padded base64url. did:jwk is unpadded, so the
      issuer DID fails with cawg.ica.invalid_did_document (branch
      fix/cawg-ica-did-jwk-unpadded).
  - id: tf_identity_trusted_ica
    reason: >-
      Never issues cawg.identity.trusted, and issues neither trusted nor well-formed for
      ICA credentials (branch fix/cawg-identity-trusted; also blocked by the did:jwk bug).
  - id: tf_identity_x509_and_ica
    reason: >-
      The ICA assertion fails with cawg.ica.invalid_did_document (did:jwk padding), and
      the X.509 assertion's well-formed is reported under cawg.identity, not __1 (#2836).
  - id: tf_identity_trusted_x509
    reason: Never issues cawg.identity.trusted (branch fix/cawg-identity-trusted).
  - id: tf_x509_email_without_policy
    reason: >-
      Trusts an emailProtection certificate with no certificate policy. Interim policy
      OIDs aren't checked (#2845); fixed upstream by c2pa-rs#3024.
  - id: tf_ica_untrusted_issuer
    reason: Fails with cawg.ica.invalid_did_document (did:jwk padding) before the issuer is checked.
  - id: tf_signer_payload_missing
    reason: No cawg.identity.cbor.invalid in crJSON (#2842).
  - id: tf_role_empty_array
    reason: >-
      Accepts role: [] and reports the assertion well-formed (branch
      fix/cawg-identity-role-cddl, together with #2842).
  - id: tf_ica_c2pa_asset_covers_fewer_assertions
    reason: >-
      Masked by the did:jwk padding bug here. With that fixed, the c2paAsset cross-check
      zips the two referenced_assertions lists, so a credential covering fewer assertions
      still matches (branch fix/cawg-ica-signer-payload-length).
  - id: tf_ica_social_media_without_username
    reason: Fails with cawg.ica.invalid_did_document (did:jwk padding); type-specific fields need #2844.
  - id: tf_metadata_context_array
    reason: >-
      Reader can't read the asset: every *.metadata assertion is parsed with the
      c2pa.metadata model, which needs @context to be a map, so the whole manifest store
      fails to load (branch fix/metadata-unparseable-jsonld). crjson-gen writes no crJSON.
  - id: tf_metadata_context_missing
    reason: Reader can't read the asset (see tf_metadata_context_array).
