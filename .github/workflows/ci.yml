name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Built rubric is up to date
        run: |
          PYTHON=python ./build_rubrics.sh
          git diff --exit-code rubrics/

      - name: Unit fixtures are up to date
        run: |
          python fixtures/unit/make_unit_fixtures.py
          git diff --exit-code fixtures/unit/

      - name: Tests
        run: PYTHON=python ./run_tests.sh -v
